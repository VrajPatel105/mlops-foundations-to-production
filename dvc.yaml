stages:
  data_ingestion:
    cmd: python "1. data-versioning/src/data_ingestion.py"
    deps:
    - 1. data-versioning/src/data_ingestion.py
    outs:
    - data/raw
  data_preprocessing:
    cmd: python "1. data-versioning/src/pre_process.py"
    deps:
    - 1. data-versioning/src/pre_process.py
    - data/raw
    outs:
    - data/processed
  feature_engineering:
    cmd: python "1. data-versioning/src/feature_engineering.py"
    deps:
    - 1. data-versioning/src/feature_engineering.py
    - data/processed
    outs:
    - data/features
  model_building:
    cmd: python "1. data-versioning/src/model_building.py"
    deps:
    - 1. data-versioning/src/model_building.py
    - data/features
    outs:
    - "1. data-versioning/model.pkl"
  model_evaluation:
    cmd: python "1. data-versioning/src/model_evaluation.py"
    deps:
    - 1. data-versioning/src/model_evaluation.py
    - data/features
    outs:
    - "1. data-versioning/metrics.json"
